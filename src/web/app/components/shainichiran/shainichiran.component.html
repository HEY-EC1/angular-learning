<div class="container">
  <h2>社員一覧</h2>

  <table border="1" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="background-color: #f2f2f2;">
        <th>社員ID</th>
        <th>氏名</th>
        <th>部署名</th>
        <th>メール</th>
        <th>役職</th>
        <th>操作</th>
        <th>状況</th>
      </tr>
    </thead>
<tbody>
  @for (shain of shainList(); track shain.id) {
    <tr>
      <td>{{ shain.id }}</td>
      <td>{{ shain.name }}</td>
      <td>{{ shain.department }}</td>
      <td>{{ shain.email }}</td>
      <td>-</td>
      <td>
        <button (click)="onDelete(shain.id)">削除</button>
      </td>
    </tr>
  }
</tbody>
  </table>
</div>

<div class="registration-form">
  <h3>新規登録</h3>
  <input [(ngModel)]="newShain.name" placeholder="氏名">
  <input [(ngModel)]="newShain.department" placeholder="部署">
  <input [(ngModel)]="newShain.email" placeholder="メール">
  <button (click)="onRegister()">登録</button>
</div>
<hr>
